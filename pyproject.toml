[project]
name = "agentthree"
version = "0.1.0"
description = "Prior authorization demo: Google ADK + A2A + MCP + Gemini"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "google-adk[mcp]>=1.0.0",
  "a2a-sdk>=0.3.0",
  "fastmcp>=2.0.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.0",
  "pydantic>=2.0.0",
  "sse-starlette>=2.0.0",
]

[project.scripts]
agentthree = "agentthree.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agentthree*"]
